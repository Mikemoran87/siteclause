<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — targeting exact search intent of Irish/UK subcontractors -->
    <title>SiteClause | Variation Claims & Compensation Events — AI for Subcontractors</title>
    <meta name="description" content="SiteClause finds every variation order and compensation event you're entitled to claim. Upload your subcontract and site correspondence — AI reads the contract, identifies missed claims, tracks notice deadlines and drafts formal notices. Built for Irish and UK subcontractors on PW-CF3, JCT, NEC and FIDIC contracts." />

    <!-- Keywords targeting real search behaviour -->
    <meta name="keywords" content="variation order Ireland, compensation event PW-CF3, construction variation claims software, subcontractor claims management, variation notice template Ireland, construction contract AI, how to claim variation order Ireland, PW-CF3 compensation event notice, construction claims software Ireland, subcontractor variation tracking, construction delay claim Ireland, JCT variation order, NEC compensation event, RIAI contract claims" />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="SiteClause" />
    <link rel="canonical" href="https://siteclause.io" />

    <!-- Open Graph — WhatsApp / LinkedIn / social previews -->
    <meta property="og:title" content="SiteClause — Your subcontract is full of money you don't know you're owed" />
    <meta property="og:description" content="AI that reads your construction contract and finds every variation claim, compensation event and notice deadline. Built for Irish and UK subcontractors. Upload your contract — get a full claims assessment in minutes." />
    <meta property="og:url" content="https://siteclause.io" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SiteClause" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SiteClause — AI Variation Claims for Construction Subcontractors" />
    <meta name="twitter:description" content="Upload your subcontract. AI finds every variation order and compensation event you're owed — with formal notices ready to send." />

    <!-- Structured data — helps Google understand what the site is -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SiteClause",
      "url": "https://siteclause.io",
      "description": "AI construction contract intelligence that finds variation orders and compensation events for subcontractors on Irish and UK construction projects.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "description": "Free contract analysis"
      },
      "audience": {
        "@type": "Audience",
        "audienceType": "Construction subcontractors, civil engineering contractors, main contractors"
      }
    }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SiteClause" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
